name: CodeSentinel

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      project_path:
        description: Project path to scan
        required: false
        default: .

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: CodeSentinel scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build scanner
        run: npm run scanner:build

      - name: Run CodeSentinel
        id: codesentinel
        continue-on-error: true
        env:
          PROJECT_PATH: ${{ github.event.inputs.project_path || '.' }}
        run: node apps/scanner/dist/index.js "$PROJECT_PATH" --format sarif > codesentinel.sarif

      - name: Upload SARIF
        if: always() && hashFiles('codesentinel.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: codesentinel.sarif

      - name: Upload scan artifact
        if: always() && hashFiles('codesentinel.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: codesentinel-sarif
          path: codesentinel.sarif

      - name: Report CodeSentinel result
        if: steps.codesentinel.outcome == 'failure'
        run: |
          echo "CodeSentinel found issues. See the uploaded SARIF artifact for details."
          echo "This workflow is report-only for now and does not fail the build on findings."
